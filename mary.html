<!DOCTYPE html>
<html>
<head>
    <title>Mary is Cool</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 50px;
            transition: background 0.5s;
        }
        #message {
            font-size: 24px;
            margin: 20px;
            display: none;
        }
        button {
            padding: 10px 20px;
            margin: 10px;
            font-size: 16px;
            cursor: pointer;
        }
        .girly {
            background-color: pink;
            color: hotpink;
        }
        .girly #message {
            text-shadow: 0 0 5px purple;
            font-style: italic;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <button onclick="showMessage()">Show Message</button>
    <button onclick="makeGirly()">Make Girly</button>
    
    <div id="message">Mary is cool</div>
    
    <script>
        function showMessage() {
            document.getElementById('message').style.display = 'block';
        }
        
        function makeGirly() {
            document.body.classList.add('girly');
        }
    </script>
</body>
</html>
